[package]
name = "oxycat"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "EUPL-1.2"
description = "Catalog your storage media and search them offline"
repository = "https://github.com/MatthieuSarter/oxycat"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37.0"
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37.0"
opener = { version = "0.9.0", features = ["reveal"] }
rayon = "1.12.0"
rfd = "0.18.0"
rusqlite = { version = "0.42.0", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"
toml = "1.2.1"
unicode-normalization = "0.1.26"
walkdir = "2.5.0"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe"] }
tempfile = "3.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
implicit_hasher = "allow"

[profile.release]
lto = "thin"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }
