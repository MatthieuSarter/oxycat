sonar.projectKey=MatthieuSarter:oxycat
sonar.projectName=MatthieuSarter:oxycat
sonar.projectBaseDir=.
sonar.projectVersion=0.3.0

sonar.sources=src
sonar.tests=tests

# Written by the check job of .forgejo/workflows/ci.yaml (cargo llvm-cov), with paths relative to the repository root.
sonar.rust.lcov.reportPaths=.reports/lcov.info
# Same exclusions as the 80% coverage gate (just coverage): the GUI, platform and entry-point shells.
sonar.coverage.exclusions=src/gui/**,src/platform/**,src/main.rs
