---
# Custom workflow: repo-linter's forgejo-workflows rule has no Rust stack.
name: Check / Release / Build / Sync
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-leaks:
    name: Check for secrets in the repository
    uses: public/workflows/.forgejo/workflows/security/gitleaks.yaml@v13

  check:
    name: Lint, test, coverage and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and tools
        run: |
          # zip: used by sonar-reports-upload to archive the coverage report.
          apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config libfontconfig1-dev zip
          # The toolchain itself (version and components) comes from rust-toolchain.toml.
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
          "$HOME/.cargo/bin/cargo" install --locked cargo-llvm-cov@0.9.1 cargo-deny@0.20.2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests and coverage (80% minimum)
        run: |
          mkdir -p .reports
          cargo llvm-cov --ignore-filename-regex 'src[\/](gui|platform)[\/]|main\.rs' --fail-under-lines 80 \
            --lcov --output-path .reports/lcov.info
          # The sonar job checks the repository out elsewhere: make the paths relative to the repository root.
          sed -i "s|^SF:$PWD/|SF:|" .reports/lcov.info
      - name: Upload the Sonar reports
        uses: ${{ forgejo.server_url }}/public/actions/sonar-reports-upload@v5
      - name: Licenses, advisories, bans and sources
        run: cargo deny check

  sonar:
    name: Run SonarQube scan and quality gate check
    needs: [check]
    uses: public/workflows/.forgejo/workflows/quality/sonar-scan.yaml@v13
    with:
      sonar-host-url: ${{ vars.SONAR_HOST_URL }}
      sonar-reports-artifact-name: sonar-reports
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}

  # No Windows runner: the Windows build (the one released) is cross-compiled and its tests run under Wine. Wine is
  # close to, not identical with, Windows (file locking, NTFS), but it does run the real Win32 calls of src/platform/.
  check-windows:
    name: Tests of the Windows build (Wine)
    runs-on: ubuntu-latest
    # Wine 9 or later is required (Rust's std imports bcryptprimitives.dll, missing from Wine 8): Debian trixie ships
    # Wine 10. The Node.js image is for actions/checkout.
    container:
      image: node:22-trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust, the Windows target, MinGW and Wine
        run: |
          apt-get update && apt-get install -y --no-install-recommends build-essential gcc-mingw-w64-x86-64 wine wine64
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
          "$HOME/.cargo/bin/rustup" target add x86_64-pc-windows-gnu
      - name: Tests under Wine
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER: wine
          WINEDEBUG: -all
          # Wine converts file names through the locale: without UTF-8, names like "Astérix" cannot be created.
          LC_ALL: C.UTF-8
          # No Mono or Gecko install prompts: the tests need neither .NET nor the HTML engine.
          WINEDLLOVERRIDES: mscoree,mshtml=
        run: |
          wineboot --init
          cargo test --target x86_64-pc-windows-gnu

  release:
    name: Create a new release
    needs: [check-leaks, sonar, check-windows]
    uses: public/workflows/.forgejo/workflows/psr/version.yaml@v13
    secrets:
      git-token: ${{ secrets.RELEASE_TOKEN }}

  # Mirrors the repository (branches and tags, no release binaries) to the GitHub.com and GitLab.com clones.
  sync:
    name: Synchronize remote repositories
    needs: [release]
    uses: public/workflows/.forgejo/workflows/git/sync.yaml@v13
    with:
      github: true
      gitlab: true
    secrets:
      SYNC_GITHUB_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN }}
      SYNC_GITLAB_TOKEN: ${{ secrets.SYNC_GITLAB_TOKEN }}

  binaries:
    name: Build and attach the binaries
    needs: [release]
    if: ${{ needs.release.outputs.new-version == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - name: Install Rust, the Windows target and MinGW
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig1-dev gcc-mingw-w64-x86-64 jq
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
          "$HOME/.cargo/bin/rustup" target add x86_64-pc-windows-gnu
      - name: Build
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cargo build --release
          cargo build --release --target x86_64-pc-windows-gnu
          mkdir dist
          cp target/release/oxycat "dist/oxycat-${VERSION}-linux-x86_64"
          cp target/x86_64-pc-windows-gnu/release/oxycat.exe "dist/oxycat-${VERSION}-windows-x86_64.exe"
      - name: Attach to the release
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          API: ${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          id=$(curl -sSf -H "Authorization: token ${TOKEN}" "${API}/releases/tags/v${VERSION}" | jq -r .id)
          for file in dist/*; do
            curl -sSf -H "Authorization: token ${TOKEN}" -F "attachment=@${file}" \
              "${API}/releases/${id}/assets?name=$(basename "${file}")" > /dev/null
          done
