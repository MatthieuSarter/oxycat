# License policy: Oxycat is EUPL-1.2; dependencies must be permissive. OFL-1.1 and Ubuntu-font-1.0 cover the fonts
# bundled by egui (epaint_default_fonts).
[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "EUPL-1.2",
  "ISC",
  "MIT",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

# Unmaintained (not vulnerable) crates pulled in by eframe/egui and opener, with no maintained release to move to yet.
# Drop each entry once egui / opener no longer depend on it.
[advisories]
ignore = [
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser, egui font parsing" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant, via zbus 5 (accesskit and opener on Linux)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names, via zbus 5 (accesskit and opener on Linux)" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via zbus 5 (accesskit and opener on Linux)" },
]
